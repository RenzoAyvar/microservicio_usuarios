
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: app-pagos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
        - name: users-api
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_ENV
              value: "production"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: JWT_SECRET_KEY

            - name: INTERNAL_SERVICE_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: INTERNAL_SERVICE_CREDENTIALS

            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: users-config
                  key: JWT_ALGORITHM

            - name: ACCESS_TOKEN_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: users-config
                  key: ACCESS_TOKEN_EXPIRE_HOURS

            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: users-config
                  key: CORS_ORIGINS

          startupProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: app-pagos
spec:
  type: ClusterIP
  selector:
    app: users-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
