apiVersion: v1
kind: ConfigMap
metadata:
  name: users-config
  namespace: app-pagos
data:
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_HOURS: "3"
  # Example only; replace with the real browser frontend origin before deployment.
  CORS_ORIGINS: "http://localhost:3000"
  MARIADB_DATABASE: "app_pagos_usuarios"
  MARIADB_USER: "appuser"
